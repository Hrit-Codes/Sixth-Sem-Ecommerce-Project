<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login — Sweet Crumbs Bakery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
<div class="login-wrap">
  <div class="login-card">
    <div class="login-header">
      <span class="logo">🥐</span>
      <h1>Sweet Crumbs</h1>
      <p>Customer Portal</p>
    </div>
    <div class="login-body">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }}" style="margin-bottom:16px">
            <span class="alert-icon">{{ '✓' if cat=='success' else '✕' if cat=='danger' else 'i' }}</span>
            <span>{{ msg }}</span>
          </div>
        {% endfor %}
      {% endwith %}

      <form method="post">
        <div class="form-group">
          <label for="email">Email</label>
          <input class="form-control" type="email" id="email" name="email"
                 placeholder="Enter your email" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div style="position:relative">
            <input class="form-control" type="password" id="password" name="password"
                   placeholder="Enter your password" required autocomplete="current-password"
                   style="padding-right:44px">
            <button type="button" onclick="togglePwd()"
                    style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1rem;color:var(--muted);padding:0;line-height:1">
              👁
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary login-btn">Sign In →</button>
      </form>

      <div style="margin-top:18px;text-align:center;font-size:0.9rem">
        <p style="color:var(--muted)">New customer? <a href="{{ url_for('customer_register') }}">Create an account</a></p>
        <p style="color:var(--muted);margin-top:6px"><a href="{{ url_for('login') }}">Staff / Admin login</a></p>
      </div>
    </div>
  </div>
</div>
<script>
function togglePwd() {
  const f = document.getElementById('password');
  f.type = f.type === 'password' ? 'text' : 'password';
}
</script>
</body>
</html>
